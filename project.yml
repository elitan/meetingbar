name: MeetingBar
options:
  bundleIdPrefix: me.eliasson
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    exactVersion: 3.0.1
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0
settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  MeetingBar:
    type: application
    platform: macOS
    sources:
      - path: MeetingBar
        excludes:
          - Resources/Info.plist
          - Resources/MeetingBar.entitlements
          - Resources/MeetingBar.requirements
    dependencies:
      - package: KeyboardShortcuts
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.eliasson.meetingbar
        PRODUCT_NAME: MeetingBar
        INFOPLIST_FILE: MeetingBar/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MeetingBar/Resources/MeetingBar.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ONLY_ACTIVE_ARCH: YES
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - MeetingBarTests
  MeetingBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MeetingBarTests
    dependencies:
      - target: MeetingBar
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.eliasson.meetingbar.tests
        GENERATE_INFOPLIST_FILE: YES
